general {
    lock_cmd = pidof hyprlock || hyprlock       # avoid starting multiple hyprlock instances.
    before_sleep_cmd = loginctl lock-session    # lock before suspend.
    after_sleep_cmd = hyprctl dispatch dpms on  # to avoid having to press a key twice to turn on the display.
}

# 10-second warning before screen off (10 min)
listener {
    timeout = 590
    on-timeout = hyprctl notify -l warn -d 10000 -m "Display off in 10s — press any key to cancel" -C "label { font-size: 16px; font-weight: bold; color: #ffcc00; }"
    on-resume = hyprctl notify -c
}

# Screen off after 10 min of inactivity
listener {
    timeout = 600
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

# 10-second warning before session lock (20 min)
listener {
    timeout = 1190
    on-timeout = hyprctl notify -l warn -d 10000 -m "Session lock in 10s — press any key to cancel" -C "label { font-size: 16px; font-weight: bold; color: #ffcc00; }"
    on-resume = hyprctl notify -c
}

# Lock session after 20 min
listener {
    timeout = 1200
    on-timeout = loginctl lock-session
}

# Suspend after 10 min of screen off
listener {
    timeout = 600
    on-timeout = systemctl suspend
}
